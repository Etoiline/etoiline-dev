name: Vérifications

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier le code avec Oxlint
        run: npm run lint

      - name: Exécuter les tests Node
        run: npm test

      # L’image Ubuntu a aussi besoin des bibliothèques système utilisées par Chromium.
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Compiler et tester le site dans Chromium
        run: npm run test:e2e
